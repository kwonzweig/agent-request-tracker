<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Tracker</title>
<style>
:root{color-scheme:light dark}body{max-width:840px;margin:0 auto;padding:24px 20px 40px;background:transparent}
#rjc{--jc-bg:light-dark(#f8f9fb,#202124);--jc-soft:light-dark(#edf0f3,#292b30);--jc-text:light-dark(#202938,#edf0f5);--jc-muted:light-dark(#4f5b6d,#c1c7d0);--jc-line:light-dark(#c7ccd4,#454a55);--jc-detail-line:light-dark(#7b8fa8,#6d839d);--jc-detail-label:light-dark(#435a75,#c9d9ed);--jc-choice-bg:light-dark(#e6effa,#28394e);--jc-choice-line:light-dark(#7189a6,#6e8db2);--jc-choice-hover:light-dark(#d8e7f9,#324963);--jc-choice-selected:light-dark(#ccdef5,#354e6b);--jc-choice-selected-line:light-dark(#365e91,#c8e1ff);--jc-choice-control:light-dark(#526e91,#acc6e4);--jc-choice-desc:light-dark(#354b67,#d9e5f5);--jc-blue:light-dark(#295d9b,#b3d4ff);--jc-blue-bg:light-dark(#e0edff,#29394e);--jc-amber:light-dark(#805506,#f0cf8b);--jc-amber-bg:light-dark(#fff3d9,#423821);--jc-red:light-dark(#a53d3d,#ffbdb9);--jc-red-bg:light-dark(#ffeded,#452b2e);--jc-green:light-dark(#246947,#a5dfbe);--jc-green-bg:light-dark(#e8f5ed,#273c32);--jc-purple:light-dark(#6943a3,#d6c1fc);--jc-purple-bg:light-dark(#f1eafa,#3a304a);--jc-teal:light-dark(#226b76,#b0dfe7);--jc-teal-bg:light-dark(#e7f4f6,#2a3f43);--jc-orange:light-dark(#944c10,#ffd2a7);--jc-orange-bg:light-dark(#fff0e2,#473323);--jc-deferred:light-dark(#965468,#efc3d0);--jc-deferred-bg:light-dark(#f9edf1,#3f2d34);--jc-slate:light-dark(#526477,#bfcede);--jc-slate-bg:light-dark(#edf1f5,#303a45);--jc-cyan:light-dark(#096d8d,#a6e4ff);--jc-cyan-bg:light-dark(#e3f5fb,#183c4b);font:400 14px/1.55 var(--font-sans,system-ui,-apple-system,'Segoe UI',sans-serif);color:var(--jc-text);background:var(--jc-bg);border:1px solid var(--jc-line);border-radius:12px;overflow-wrap:anywhere}
#rjc *{box-sizing:border-box}#rjc [hidden]{display:none!important}#rjc h2,#rjc h3,#rjc p{margin:0}#rjc h2,#rjc h3,#rjc strong{font-weight:500}#rjc h2{font-size:16px;margin-bottom:12px}#rjc h3{font-size:15px;margin:10px 0 6px}#rjc button,#rjc select{font:inherit;color:var(--jc-text);background:var(--jc-bg);border:1px solid var(--jc-line);border-radius:7px;padding:8px 12px;max-width:100%}#rjc button:hover{background:var(--jc-soft)}#rjc button:disabled{opacity:.5}#rjc button[aria-pressed=true]{border-color:var(--jc-blue);background:var(--jc-blue-bg)}#rjc button:focus-visible,#rjc select:focus-visible,#rjc textarea:focus-visible,#rjc summary:focus-visible,#rjc a:focus-visible{outline:2px solid var(--jc-blue);outline-offset:3px}
#rjc .jc-header{display:flex;align-items:center;padding:16px 20px}#rjc .jc-header strong{font-size:16px}#rjc .jc-response{padding:0 20px 16px}#rjc .jc-run{display:flex;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;background:var(--jc-soft);border-block:1px solid var(--jc-line);padding:12px 20px}#rjc .jc-run-part{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}#rjc .jc-run-label{color:var(--jc-text);font-weight:500}
#rjc .jc-badge{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;line-height:1.5;background:var(--jc-soft);color:var(--jc-muted)}
#rjc .jc-badge.decision,#rjc .jc-badge.pending{color:var(--jc-amber);background:var(--jc-amber-bg)}#rjc .jc-badge.blocker,#rjc .jc-badge.blocked,#rjc .jc-badge.cancelled{color:var(--jc-red);background:var(--jc-red-bg)}#rjc .jc-badge.qa{color:var(--jc-teal);background:var(--jc-teal-bg)}#rjc .jc-badge.note,#rjc .jc-badge.waiting{color:var(--jc-purple);background:var(--jc-purple-bg)}#rjc .jc-badge.suggestion{color:var(--jc-orange);background:var(--jc-orange-bg)}#rjc .jc-badge.active{color:var(--jc-blue);background:var(--jc-blue-bg)}#rjc .jc-badge.done,#rjc .jc-badge.resolved,#rjc .jc-badge.completion{color:var(--jc-green);background:var(--jc-green-bg)}#rjc .jc-badge.answered{color:var(--jc-cyan);background:var(--jc-cyan-bg)}#rjc .jc-badge.deferred,#rjc .jc-badge.superseded{color:var(--jc-muted);background:var(--jc-soft)}#rjc .jc-badge.jc-card-status{background:transparent;border:1px solid currentColor}#rjc .jc-badge.jc-request-status{border-radius:6px}#rjc .jc-badge.jc-draft-hint{color:var(--jc-blue);background:var(--jc-blue-bg)}
#rjc .jc-tabs{display:flex;gap:8px;padding:0 16px;border-bottom:1px solid var(--jc-line)}#rjc .jc-tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;flex:1;padding:14px 4px;font-weight:500;background:transparent;min-width:0}#rjc .jc-tabs button[aria-selected=true]{border-color:var(--jc-blue);color:var(--jc-blue)}#rjc .jc-tabs span{display:inline-block;border-radius:5px;padding:0 5px;margin-left:3px;background:var(--jc-amber-bg);color:var(--jc-amber);font-size:11px}#rjc .jc-content{padding:16px 20px}
#rjc details{margin-top:10px}#rjc summary{cursor:pointer}#rjc .jc-card,#rjc .jc-request{border:1px solid var(--jc-line);border-radius:9px;background:light-dark(#fff,#202124);margin:0 0 12px;padding:14px}#rjc .jc-request>details{margin:0}#rjc .jc-record-summary{display:block;list-style:none;color:var(--jc-text)}#rjc .jc-record-summary::-webkit-details-marker{display:none}#rjc .jc-summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}#rjc .jc-summary-main{flex:1;min-width:0}#rjc .jc-title-line{font-size:16px;line-height:1.6}#rjc .jc-title-line:before{content:'›';color:var(--jc-muted);font-size:18px;display:inline-block;margin-right:6px;line-height:1}#rjc .jc-record[open]>.jc-record-summary .jc-title-line:before{content:'⌄'}#rjc .jc-title-line>.jc-badge{margin-right:6px}#rjc .jc-record-title{display:inline;font-size:16px;font-weight:500}#rjc .jc-status-strip{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;flex-shrink:0;padding-top:2px;max-width:40%}#rjc details[open]>summary .jc-draft-hint{display:none}#rjc .jc-record-refs,#rjc .jc-link-overflow{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px}#rjc .jc-record-refs{margin-top:9px}#rjc .jc-record-refs .jc-link{display:inline-flex;max-width:100%;padding:3px 8px;font-size:12px;line-height:1.5;text-align:left;white-space:normal;overflow-wrap:anywhere;border:1px solid currentColor;border-radius:6px;background:transparent;text-decoration:none}#rjc .jc-record-refs .jc-request-link{color:var(--jc-blue)}#rjc .jc-record-refs .jc-workspace-link{color:var(--jc-purple)}#rjc .jc-record-refs .jc-resource-link{color:var(--jc-teal)}#rjc .jc-record-refs .jc-link:hover{background:var(--jc-soft)}#rjc .jc-record-refs .jc-links-toggle{padding:2px 8px;line-height:1.5;font-size:14px;color:var(--jc-muted);background:transparent}#rjc .jc-record-body,#rjc .jc-request-body{border-top:1px solid var(--jc-line);margin-top:12px;padding-top:12px;font-size:14px}#rjc .jc-content-box{padding:10px 12px;border:1px solid var(--jc-line);border-radius:7px;background:var(--jc-soft);white-space:pre-wrap}#rjc .jc-record-body>*+*{margin-top:16px}#rjc .jc-request-body>*+*{margin-top:10px}#rjc .jc-primary{padding:2px 0 8px;border:0;border-radius:0;background:transparent;line-height:1.75}#rjc .jc-detail-field,#rjc .jc-option-context{border:0;border-left:3px solid var(--jc-detail-line);border-radius:0;background:transparent;padding:4px 0 4px 13px}#rjc .jc-detail-field>strong{display:block;font-weight:500;font-size:12px;color:var(--jc-detail-label);margin-bottom:4px}#rjc .jc-detail-field>p,#rjc .jc-option-context>p{margin-top:4px}#rjc .jc-change{display:block;margin-top:7px;color:var(--jc-muted);font-size:12px}#rjc .jc-reminder{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--jc-red);border-radius:50%;color:var(--jc-red);font-size:13px;font-weight:600;line-height:1}#rjc .jc-nudge{padding:8px 10px;background:var(--jc-soft);border-radius:6px}#rjc .jc-nudge.high{border:1px solid var(--jc-line)}
#rjc .jc-options{display:grid;gap:10px}#rjc .jc-options button{position:relative;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:2px 10px;text-align:left;cursor:pointer;background:var(--jc-choice-bg);border:1px solid var(--jc-choice-line);padding:12px 42px 12px 14px;transition:background .12s,border-color .12s}#rjc .jc-options button:hover{background:var(--jc-choice-hover);border-color:var(--jc-blue)}#rjc .jc-options button[aria-pressed=true]{background:var(--jc-choice-selected);border-color:var(--jc-choice-selected-line);box-shadow:inset 0 0 0 1px var(--jc-choice-selected-line)}#rjc .jc-options button:after{content:'';position:absolute;right:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;border:1.5px solid var(--jc-choice-control);border-radius:50%}#rjc .jc-options button[aria-pressed=true]:after{background:var(--jc-choice-selected-line);box-shadow:inset 0 0 0 4px var(--jc-choice-selected)}#rjc .jc-option-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:500;min-width:0}#rjc .jc-option-desc{font-size:12px;color:var(--jc-choice-desc);line-height:1.6;margin-top:3px;min-width:0}#rjc .jc-recommendation{font-size:12px;font-weight:400;color:var(--jc-green);white-space:nowrap}#rjc .jc-options .jc-check{display:none}#rjc .jc-actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--jc-line);padding-top:12px;margin-top:12px}#rjc .jc-actions button{font-size:14px;padding:7px 12px}#rjc .jc-actions .jc-primary-action{color:var(--jc-green);background:var(--jc-green-bg);border-color:var(--jc-green)}#rjc .jc-actions .jc-primary-action[aria-pressed=true]{color:var(--jc-green);border-color:var(--jc-green);box-shadow:inset 0 0 0 1px var(--jc-green)}#rjc .jc-input label{display:block;font-size:12px;color:var(--jc-muted);margin-bottom:5px}#rjc textarea{display:block;width:100%;max-width:100%;resize:vertical;min-height:66px;font:inherit;line-height:1.5;border:1px solid var(--jc-line);border-radius:6px;background:var(--jc-bg);color:var(--jc-text);padding:9px 10px}#rjc .jc-user-reply{padding:8px 10px;background:var(--jc-blue-bg);border-radius:6px;white-space:pre-wrap}#rjc .jc-user-reply>span{display:block;font-size:12px;color:var(--jc-blue)}#rjc .jc-user-reply p{margin-top:4px}#rjc .jc-reply-context{font-size:12px;color:var(--jc-muted)}#rjc .jc-field-label{font-weight:500;font-size:12px;color:var(--jc-muted)}#rjc .jc-done-when{margin:6px 0 0;padding-left:20px;white-space:normal}#rjc .jc-done-when li+li{margin-top:4px}
#rjc .jc-section-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}#rjc .jc-section-top h2{margin:0}#rjc .jc-section-top select{font-size:13px;padding:6px 9px}#rjc .jc-filter{display:flex;gap:4px;background:var(--jc-soft);border-radius:7px;padding:3px}#rjc .jc-filter button{font-size:13px;padding:5px 9px;border-color:transparent;background:transparent}#rjc .jc-filter button[aria-pressed=true]{background:var(--jc-bg);border-color:var(--jc-line)}#rjc .jc-branch{margin:12px 0 0 7px;padding-left:16px;border-left:2px solid var(--jc-line)}#rjc .jc-context>details>summary{color:var(--jc-muted)}#rjc .jc-revealed{outline:2px solid var(--jc-blue);outline-offset:3px}#rjc .jc-workspace-group+.jc-workspace-group{margin-top:20px}#rjc .jc-workspace-group h3{margin-bottom:6px}#rjc .jc-workspace-heading{font-size:14px;color:var(--jc-blue);text-decoration:none}
#rjc .jc-history-nav{display:flex;gap:8px;align-items:center;margin-bottom:16px}#rjc .jc-history-nav select{flex:1;min-width:0}#rjc .jc-history-nav button{font-size:18px;padding:5px 12px}#rjc .jc-turn-body{padding:12px 14px;background:var(--jc-soft);border-radius:7px;margin-bottom:18px}#rjc .jc-turn-body>.jc-content-box{margin-top:10px}#rjc .jc-history-section+.jc-history-section{margin-top:22px}#rjc .jc-connection{margin:0;padding:0 20px 12px;font-size:12px;color:var(--jc-muted)}#rjc .jc-connection.error,#rjc .jc-warning{color:var(--jc-red)}#rjc .jc-warning{padding:10px 12px;margin:10px 0;border:1px solid var(--jc-line);border-radius:6px;font-size:12px}#rjc .jc-warning button{margin:8px 0 0;font-size:12px}#rjc .jc-draft-detail{margin:8px 20px}#rjc .jc-empty{padding:12px 0;color:var(--jc-text)}#rjc .jc-footer{position:sticky;bottom:0;background:var(--jc-bg);border-top:1px solid var(--jc-line);border-radius:0 0 12px 12px;padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}#rjc .jc-footer>span{font-size:12px;color:var(--jc-muted)}#rjc .jc-footer button{background:var(--jc-blue-bg);border-color:var(--jc-blue-bg);color:var(--jc-blue);white-space:nowrap;font-weight:500}
@media(max-width:480px){body{padding:16px 10px 28px}#rjc .jc-content{padding:14px 12px}#rjc .jc-header,#rjc .jc-run{padding-left:14px;padding-right:14px}#rjc .jc-response{padding-inline:14px}#rjc .jc-card,#rjc .jc-request{padding:12px}#rjc .jc-summary-top{gap:8px}#rjc .jc-status-strip{max-width:36%}#rjc .jc-run-part{width:100%}#rjc .jc-tabs{padding:0 6px;gap:2px}#rjc .jc-tabs button{font-size:13px;padding:12px 2px}#rjc .jc-footer{padding:12px;flex-wrap:wrap}#rjc .jc-footer button{margin-left:auto}#rjc .jc-branch{padding-left:10px}#rjc .jc-connection{padding-inline:14px}#rjc .jc-draft-detail{margin-inline:12px}#rjc .jc-options button{grid-template-columns:minmax(0,1fr)}}
@media(pointer:coarse){#rjc button,#rjc select,#rjc summary,#rjc a{min-height:44px}#rjc summary{align-content:center}#rjc textarea{font-size:16px}}
#rjc .jc-reply-link{color:var(--jc-blue);text-underline-offset:.15em}
#rjc .jc-comment-toggle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:6px;color:var(--jc-blue);border-color:var(--jc-blue);background:var(--jc-blue-bg);flex-shrink:0}#rjc .jc-comment-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}#rjc .jc-comment-editor{margin-top:8px}#rjc .jc-actions .jc-later-action{color:var(--jc-blue);border-color:var(--jc-blue);background:var(--jc-blue-bg);font-weight:500}#rjc .jc-actions .jc-later-action[aria-pressed=true]{color:var(--jc-blue);border-color:var(--jc-blue);background:var(--jc-blue-bg);box-shadow:inset 0 0 0 1px var(--jc-blue)}#rjc .jc-read-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;min-width:32px;min-height:32px;padding:0;border-radius:50%;line-height:1;color:var(--jc-blue);background:transparent;border:1px solid #707887;flex-shrink:0}#rjc .jc-attention-card .jc-title-line:before{content:none}#rjc .jc-read-icon svg{width:16px;height:16px}

#rjc .jc-card-footer{border-top:1px solid var(--jc-line);padding-top:12px;margin-top:12px}
#rjc .jc-card-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#rjc .jc-card-tools>.jc-record-refs{margin-top:0;flex:1;min-width:0;align-items:center}
#rjc .jc-comment-toggle:hover,#rjc .jc-actions .jc-later-action:hover,#rjc .jc-read-icon:hover{background:light-dark(#cce1ff,#354b65);border-color:var(--jc-blue)}
#rjc .jc-read-icon:hover{background:var(--jc-blue-bg)}
#rjc .jc-read-icon:disabled,#rjc .jc-comment-toggle:disabled{opacity:.55}
@media(prefers-reduced-motion:reduce){#rjc .jc-options button{transition:none}}
</style></head><body>
<section id="rjc" aria-label="Request Tracker">
<header class="jc-header"><strong>Request Tracker</strong></header>
<div class="jc-response" hidden aria-hidden="true"><p id="jc-response">Loading your requests…</p></div>
<div class="jc-run"><div class="jc-run-part"><span class="jc-run-label">Goal:</span><span id="jc-goal-title">—</span><span id="jc-goal-status" class="jc-badge neutral" hidden aria-hidden="true">Unknown</span></div><div class="jc-run-part" hidden aria-hidden="true"><span id="jc-agent-status" class="jc-badge neutral">Unknown</span></div></div>
<nav class="jc-tabs" role="tablist" aria-label="Journal sections">
<button type="button" id="jc-attention-tab" role="tab" aria-controls="jc-attention" aria-selected="true" data-tab="attention">Attention <span id="jc-count">0</span></button>
<button type="button" id="jc-requests-tab" role="tab" aria-controls="jc-requests" aria-selected="false" data-tab="requests">Requests</button>
<button type="button" id="jc-cards-tab" role="tab" aria-controls="jc-cards" aria-selected="false" data-tab="cards">Cards</button>
<button type="button" id="jc-history-tab" role="tab" aria-controls="jc-history" aria-selected="false" data-tab="history">History</button>
</nav>
<div class="jc-content">
<section id="jc-attention" role="tabpanel" aria-labelledby="jc-attention-tab"><div id="jc-attention-body"><p class="jc-empty">Waiting for the saved journal…</p></div></section>
<section id="jc-requests" role="tabpanel" aria-labelledby="jc-requests-tab" hidden>
<div class="jc-section-top"><h2>Requests</h2><div class="jc-filter" role="group" aria-label="Request status"><button type="button" data-filter="active" aria-pressed="true">Active</button><button type="button" data-filter="done" aria-pressed="false">Done</button><button type="button" data-filter="all" aria-pressed="false">All</button></div><select id="jc-request-view" aria-label="Request view"><option value="tree">Request tree</option><option value="workspace">By workspace</option></select></div><div id="jc-tree"></div>
</section>
<section id="jc-cards" role="tabpanel" aria-labelledby="jc-cards-tab" hidden>
<div class="jc-section-top"><h2>Cards</h2><select id="jc-card-filter" aria-label="Card status"><option value="all">All</option><option value="open">Open</option><option value="closed">Closed</option><option value="deferred">Later</option></select></div><div id="jc-cards-body"></div>
</section>
<section id="jc-history" role="tabpanel" aria-labelledby="jc-history-tab" hidden>
<div class="jc-history-nav"><button type="button" id="jc-prev" aria-label="Previous turn" disabled>←</button><select id="jc-turn" aria-label="Turn"></select><button type="button" id="jc-next" aria-label="Next turn" disabled>→</button></div>
<div id="jc-turn-body" class="jc-turn-body"></div>
<div id="jc-records">
<p id="jc-history-empty" class="jc-empty" hidden>No changes in this turn.</p>
<section class="jc-history-section" aria-labelledby="jc-history-requests-title"><div class="jc-section-top"><h2 id="jc-history-requests-title">Requests</h2></div><div id="jc-history-requests"></div></section>
<section class="jc-history-section" aria-labelledby="jc-history-cards-title"><div class="jc-section-top"><h2 id="jc-history-cards-title">Cards</h2></div><div id="jc-history-cards"></div></section>
</div>
</section>
</div>
<p id="connection" class="jc-connection" role="status" aria-live="polite">Checking the saved journal…</p>
<p id="jc-storage" class="jc-warning jc-draft-detail" role="status" hidden></p>
<section id="jc-queued-comments" class="jc-draft-detail" aria-label="Unsent comments" hidden></section>
<footer class="jc-footer"><span id="jc-draft" role="status" aria-live="polite"></span><button type="button" id="jc-send" disabled>Send reply</button></footer>
</section><script>/* JOURNAL_SCRIPT */</script></body></html>
